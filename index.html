<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <title>学习测验</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .timed-hint{margin:-2px 0 14px;padding:10px 12px;border:1px solid var(--line,#ddd6c8);border-radius:12px;background:var(--surface-soft,#faf7f0);font-size:.84rem;line-height:1.55;color:var(--muted,#6f675d)}
    .timer-box{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:6px 9px;border:1px solid var(--line,#ddd6c8);border-radius:999px;background:var(--surface,#fff);font-size:.78rem;font-variant-numeric:tabular-nums}
    .timer-box strong{font-size:.94rem}
    .timer-box.warning{font-weight:700}
    .timer-box.critical{outline:2px solid currentColor;outline-offset:2px}
    @media(max-width:640px){.quiz-topline{flex-wrap:wrap}.progress-track{min-width:110px;flex:1}.timer-box{margin-left:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">STUDY QUIZ</p>
        <h1>今天只做眼前这几题。</h1>
        <p class="subtitle">选择题自动判分 · 四科均衡抽题 · 支持 2 分钟 / 题限时测验</p>
      </div>
      <div class="streak" aria-label="今日完成数">
        <strong id="todayCount">0</strong>
        <span>今日已做</span>
      </div>
    </header>

    <section id="setup" class="panel setup-panel">
      <div class="field">
        <label for="questionType">题型</label>
        <select id="questionType">
          <option value="all">全部题型</option>
          <option value="choice">选择题</option>
          <option value="subjective">简答 / 论述题</option>
        </select>
      </div>
      <div class="field">
        <label for="subject">科目</label>
        <select id="subject">
          <option value="all">全部科目</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">范围 / 模式</label>
        <select id="mode">
          <option value="random">随机抽题（最近做过的题优先冷却）</option>
          <option value="timed">限时测验（2 分钟 / 题）</option>
          <option value="sequential">顺序练习</option>
          <option value="review">只练错题 / 模糊 / 不会</option>
          <option value="favorites">只练收藏题</option>
        </select>
      </div>
      <div class="field">
        <label for="count">本次题量</label>
        <div class="stepper">
          <button id="decrease" type="button" aria-label="减少题量">−</button>
          <input id="count" type="number" min="1" max="30" value="5" inputmode="numeric">
          <button id="increase" type="button" aria-label="增加题量">＋</button>
        </div>
      </div>
      <div id="timedHint" class="timed-hint hidden" aria-live="polite"></div>
      <button id="start" class="primary" type="button">开始本轮</button>
      <div class="setup-actions">
        <button id="submitToday" class="secondary" type="button">提交今天记录给 ChatGPT</button>
        <button id="exportProgress" class="secondary" type="button">备份本机记录</button>
      </div>
      <button id="resetProgress" class="text-button" type="button">清空本机学习记录</button>
    </section>

    <section id="quiz" class="quiz hidden" aria-live="polite">
      <div class="quiz-topline">
        <button id="quit" class="back-button" type="button">退出</button>
        <div class="progress-track"><span id="progressBar"></span></div>
        <span id="timerBox" class="timer-box hidden" aria-label="限时测验剩余时间">剩余 <strong id="timerText">00:00</strong></span>
        <span id="progressText">1 / 5</span>
      </div>

      <article class="question-card">
        <div class="question-meta">
          <div>
            <span id="questionTypeBadge"></span>
            <span id="questionSubject"></span>
            <span id="questionNumber"></span>
          </div>
          <button id="favorite" class="favorite-button" type="button" aria-pressed="false">☆ 收藏</button>
        </div>
        <h2 id="questionTitle"></h2>
        <div id="questionPrompt" class="prompt"></div>

        <section id="choiceInput" class="hidden">
          <div id="choiceOptions" class="choice-options"></div>
          <button id="submitChoice" class="primary" type="button" disabled>提交选择</button>
        </section>

        <section id="subjectiveInput">
          <label class="answer-label" for="userAnswer">先写关键词骨架（可选）</label>
          <textarea id="userAnswer" rows="6" placeholder="不求完整，先写能得分的关键词……"></textarea>
          <button id="reveal" class="primary" type="button">提交并查看答案</button>
        </section>

        <label class="answer-label note-label" for="questionNote">这道题的笔记</label>
        <textarea id="questionNote" class="note-box" rows="3" placeholder="例如：漏了原因②；这个选项总和某概念混淆……"></textarea>
        <p class="save-hint">笔记和收藏会自动保存在本机；提交报告时会一起带给 ChatGPT。</p>

        <section id="answerArea" class="answer-area hidden">
          <div class="answer-heading">
            <h3 id="answerHeading">参考答案</h3>
            <button id="toggleMine" class="text-button" type="button">对照我的答案</button>
          </div>
          <div id="mine" class="mine hidden"></div>
          <div id="choiceResult" class="choice-result hidden"></div>
          <div id="referenceAnswer" class="reference-answer"></div>
          <p class="rating-title">这道题现在属于：</p>
          <div class="ratings">
            <button data-rating="known" class="known" type="button">会</button>
            <button data-rating="unsure" class="unsure" type="button">模糊 / 蒙对</button>
            <button data-rating="unknown" class="unknown" type="button">不会</button>
          </div>
        </section>
      </article>
    </section>

    <section id="finish" class="panel finish hidden">
      <p class="eyebrow">ROUND COMPLETE</p>
      <h2>这一轮完成了。</h2>
      <div id="summary" class="summary"></div>
      <button id="submitRound" class="primary" type="button">提交本轮给 ChatGPT</button>
      <p id="reportStatus" class="report-status"></p>
      <button id="again" class="secondary wide" type="button">再来一轮</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
